name: Python Integration Test with vcsim

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      vcsim:
        image: vmware/vcsim:latest
        ports:
          - 8989:8989
        options: >-
          --health-cmd "curl --insecure --fail https://localhost:8989/sdk || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
              pip install -r requirements.txt
          fi

      - name: Run Tests
        env:
          # Point your test suite to the GitHub runner's localhost map
          VCENTER_HOST: "localhost"
          VCENTER_PORT: 8989
          VCENTER_USER: "administrator@vsphere.local"
          VCENTER_PASS: "password"
        run: |
          if [ -f test/test.py ]; then
            python test.py
          else
            echo "No test.py found, skipping tests."
          fi
