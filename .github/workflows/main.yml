name: Python Integration Test with vcsim

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      vcsim:
        image: vmware/vcsim:latest
        ports:
          - 8989:8989

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
              pip install -r requirements.txt
          fi

      - name: Run Tests
        env:
          # Point your test suite to the GitHub runner's localhost map
          VCENTER_HOST: "127.0.0.1"
          VCENTER_PORT: "8989"
          VCENTER_USER: "user"
          VCENTER_PASS: "pass"
        run: |
          if [ -f test/test.py ]; then
            python test.py
          else
            echo "No test.py found, skipping tests."
          fi
